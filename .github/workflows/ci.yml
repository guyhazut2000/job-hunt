name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunt" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobhunt:jobhunt@localhost:5432/jobhunt?schema=public
      AUTH_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - name: Schema has a matching migration (no drift)
        run: |
          echo 'CREATE DATABASE jobhunt_shadow;' | npx prisma db execute --stdin --url "$DATABASE_URL"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://jobhunt:jobhunt@localhost:5432/jobhunt_shadow?schema=public" \
            --exit-code \
            || { echo "::error file=prisma/schema.prisma::schema.prisma changed without a migration. Run: npx prisma migrate dev --name <change>"; exit 1; }
      - name: New migrations are additive
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run db:check-additive
      - run: npm run db:seed
      - run: npm run build
      - name: Signed-in e2e (onboarding, CV export, undo, load-more, ranking, saved place, outreach)
        env:
          AUTH_TRUST_HOST: "true"
          AUTH_URL: http://localhost:3000
          BASE_URL: http://localhost:3000
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run test:e2e || (tail -100 /tmp/next.log; exit 1)
